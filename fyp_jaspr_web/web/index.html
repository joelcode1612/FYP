<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sitewise — F&B Location Intelligence</title>
  <meta name="description"
    content="Sitewise — evidence-based F&B commercial property selection. Compare locations by population, accessibility, competition and demand before you commit." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="index, follow" />
  <!-- Public API base for the browser auth bridge. Empty = same-origin: the
         unified FastAPI server hosts both the app and /api/v1. A deployment can
         point this elsewhere only if that origin allows this site via CORS. -->
  <meta name="sitewise-api" content="" />

  <link rel="icon" type="image/png" href="/assets/sitewise-icon-32.png" />
  <link rel="apple-touch-icon" href="/assets/sitewise-icon-180.png" />

  <link rel="stylesheet" type="text/css" href="/styles.css" />
  <link rel="stylesheet" type="text/css" href="/staff-mfa.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
  <link rel="stylesheet" href="/assessment-workflow.css" />
  <!-- M2 Stage 2 workspace layout. Kept as its own file so the assessment
       journey stepper, progress panel and AppLayout topbar are untouched. -->
  <link rel="stylesheet" href="/m2_workspace_layout.css" />
  <script src="/vendor/three.min.js" defer></script>
  <!-- Explore map: self-hosted Leaflet + markercluster (no CDN, no API key).
       Loaded with defer so execution order is leaflet -> cluster ->
       sitewise_combined_explore -> main.client.dart.js. The explore script
       only reacts to DOM state this app renders; the app bundle still boots
       exactly as before. -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/vendor/leaflet/MarkerCluster.css" />
  <link rel="stylesheet" href="/vendor/leaflet/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/sitewise_combined_explore.css" />
  <link rel="stylesheet" href="/property_detail_upgrade.css" />
  <link rel="stylesheet" href="/full_analysis.css" />
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/vendor/leaflet/leaflet.markercluster.js" defer></script>
  <script src="/map-config.js" defer></script>
  <script src="/sitewise_combined_explore.js" defer></script>
  <script src="/three_scene.js" defer></script>
  <script src="/reveal.js" defer></script>
  <script src="/auth_bundle.js" defer></script>

  <!-- Loads and runs the compiled 'main.client.dart' file (the router and
         every page; jaspr_builder generates the web entrypoint stub). -->
  <script defer src="/main.client.dart.js"></script>
</head>

<body>
  <noscript>
    Sitewise uses JavaScript for filtering, saving and comparisons. Pages,
    listings and navigation still read without it.
  </noscript>
  <!-- Pre-boot placeholder: discarded when the app mounts (jaspr removes any
         body children it does not hydrate). -->
  <div id="boot" style="min-height: 100vh; display: grid; place-items: center">
    <span aria-hidden="true" class="spinner"></span>
  </div>
</body>

</html>
