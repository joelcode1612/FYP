group 'io.carius.lars.ar_flutter_plugin'
version '1.0-SNAPSHOT'

// Vendored copy of ar_flutter_plugin 0.7.3.
//
// Only build wiring differs from the pub.dev release; the plugin code is
// untouched. Changes:
//   * `namespace` declared (required by AGP 8+; the manifest `package`
//     attribute alone is no longer enough).
//   * No `jcenter()` (removed in Gradle 9).
//   * The AGP 4.1.0 / Kotlin 1.3.50 classpath pin was dropped. The app supplies
//     AGP 9.0.1 and Kotlin 2.3.20 from settings.gradle.kts; the stale pin left
//     Kotlin targeting the JDK's JVM 21 while Java compiled at 11, which AGP
//     rejects as "Inconsistent JVM-target compatibility".
//   * Java/Kotlin targets pinned to 17 to match the app module.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.carius.lars.ar_flutter_plugin'
    // Was 30 in the upstream release. AGP 9 rejects compiling a library against
    // an SDK older than its transitive dependencies require (androidx.arch.core
    // and androidx.window both demand >= 33; the app uses 36).
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "com.google.ar:core:1.22.0"

    implementation 'com.google.ar.sceneform:core:1.15.0'
    implementation 'com.google.ar.sceneform:assets:1.15.0'

    implementation 'com.google.android.gms:play-services-auth:16+'
    implementation 'com.google.ar.sceneform.ux:sceneform-ux:1.17.1'
    implementation 'androidx.appcompat:appcompat:1.3.0'
}

afterEvaluate {
    def containsEmbeddingDependencies = false
    for (def configuration : configurations) {
        for (def dependency : configuration.dependencies) {
            if (dependency.group == 'io.flutter' &&
                    dependency.name.startsWith('flutter_embedding') &&
                    dependency.isTransitive())
            {
                containsEmbeddingDependencies = true
                break
            }
        }
    }
    if (!containsEmbeddingDependencies) {
        android {
            dependencies {
                def lifecycle_version = "1.1.1"
                compileOnly "android.arch.lifecycle:runtime:$lifecycle_version"
                compileOnly "android.arch.lifecycle:common:$lifecycle_version"
                compileOnly "android.arch.lifecycle:common-java8:$lifecycle_version"
            }
        }
    }
}