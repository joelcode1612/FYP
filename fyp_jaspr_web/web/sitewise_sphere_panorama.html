<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="referrer" content="no-referrer">
  <title>SiteWise — interactive 360° panorama</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #0b0f19; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    #viewer { position: absolute; inset: 0; touch-action: none; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
    #viewer.dragging { cursor: grabbing; }
    #viewer canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; text-align: center; padding: 22px; background: #0b0f19; font-size: 13px; line-height: 1.6; }
    #status[hidden] { display: none; }
    #controls { position: absolute; z-index: 2; right: 12px; bottom: 12px; display: flex; gap: 6px; }
    #controls button { display: grid; place-items: center; min-width: 39px; height: 38px; border: 1px solid #ffffff40; border-radius: 9px; background: #101b2ecf; color: #fff; font: 600 16px system-ui; cursor: pointer; }
    #controls button:last-child { font-size: 12px; padding: 0 11px; }
    #controls button:focus-visible, #viewer:focus-visible { outline: 2px solid #93c5fd; outline-offset: -3px; }
    #hint { position: absolute; z-index: 2; left: 12px; bottom: 12px; padding: 7px 10px; border-radius: 999px; background: #0b0f19bc; color: #fff; font-size: 11px; pointer-events: none; }
    @media (max-width: 460px) { #hint { bottom: 60px; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  
    /* SITEWISE_ADMIN_REVIEW_UI_V1 */
    #sphere-fullscreen { position:absolute; z-index:6; top:12px; right:12px; min-height:48px; padding:0 14px; border:1px solid #ffffff66; border-radius:10px; color:#fff; background:#101b2eeb; font:600 14px system-ui; cursor:pointer; }
    #sphere-fullscreen:focus-visible { outline:2px solid #93c5fd; outline-offset:3px; }
    #controls { gap:8px; }
    #controls button { min-width:48px; min-height:48px; }
    #sphere-fullscreen[hidden] { display:none; }
    #sphere-fullscreen-note { position:absolute; z-index:7; top:70px; right:12px; max-width:min(320px,85vw); padding:8px 12px; border-radius:8px; background:#101b2eeb; color:white; font-size:13px; }
    #sphere-fullscreen-note[hidden] { display:none; }
    @media(max-width:460px){ #hint { bottom:74px; } }

  </style>
  <script src="/vendor/three.min.js" defer></script>
  <script src="/sitewise_sphere_panorama.js" defer></script>
  <script src="/sitewise_sphere_fullscreen.js" defer></script>
</head>
<body>
  <div id="viewer" tabindex="0" role="application" aria-label="360 degree panorama. Drag or swipe to turn, pinch or use plus and minus to zoom, arrow keys to look around."></div>
  <div id="status" role="status">Preparing 360° panorama…</div>
  <span id="hint">Swipe or drag to look around · Pinch to zoom</span>
  <div id="controls" role="group" aria-label="Panorama controls">
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="reset" type="button" aria-label="Reset view">Reset</button>
  </div>
  <button id="sphere-fullscreen" type="button" aria-label="Enter full screen" aria-pressed="false">⛶ Full screen</button>
  <span id="sphere-fullscreen-note" role="status" hidden></span>
</body>
</html>
