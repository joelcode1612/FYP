# Gradle JVM sizing for a 16 GB development host. The previous 8G heap plus
# 4G metaspace competed with Android Studio (JBR), the Dart frontend server,
# the Flutter tool and the running backend; with <1 GB of free RAM the build
# was paging to disk. 4G heap / 2G metaspace is Flutter's documented scale
# for AGP 8 + Kotlin and still leaves headroom for the other daemons.
# Release/distribution builds keep this same cap; only the ABI target differs.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# `com.google.ar.sceneform:sceneform-ux:1.17.1` (via ar_flutter_plugin) was
# published against the pre-AndroidX support library (27.1.0), so its classes
# collide with androidx.core at :app:checkDebugDuplicateClasses. Jetifier
# rewrites those artifacts to their androidx equivalents.
android.enableJetifier=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
