name: shared_logic
description: >-
  Framework-free domain and data layers shared by the Sitewise Flutter app and
  the Jaspr web app. No Flutter, no Jaspr, no third-party dependencies.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Member of the fyp_workspace pub workspace: dependency resolution and the
# lockfile are shared with the sibling packages.
resolution: workspace

# Pure Dart only. A dependency is acceptable here when it is itself pure Dart
# and therefore usable from both apps; a Flutter-only or Jaspr-only package
# would break the other platform's build.
#
# `bloc` and `riverpod` both qualify: both are pure Dart. `riverpod` is the
# state container for the Riverpod/MVVM feature work (M2 assessment first);
# `bloc` remains for the pre-existing AppCubit/AdminCubit/EntrepreneurCubit/
# OwnerCubit until those are migrated.
dependencies:
  bloc: ^9.2.1
  riverpod: ^3.3.2
dev_dependencies:
  # 1.31.1 requires test_api 0.7.12, but flutter_test (SDK 3.44.6) pins 0.7.11.
  # Bumping this breaks workspace resolution for both apps.
  test: 1.31.0
