<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sitewise — F&B Location Intelligence</title>
  <meta name="description"
    content="Sitewise — evidence-based F&B commercial property selection. Compare locations by population, accessibility, competition and demand before you commit." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="index, follow" />
  <!-- Public API base for the browser auth bridge. Empty = same-origin: the
         unified FastAPI server hosts both the app and /api/v1. A deployment can
         point this elsewhere only if that origin allows this site via CORS. -->
  <meta name="sitewise-api" content="" />

  <link rel="icon" type="image/png" href="/assets/sitewise-icon-32.png" />
  <link rel="apple-touch-icon" href="/assets/sitewise-icon-180.png" />

  <link rel="stylesheet" type="text/css" href="/styles.css" />
  <link rel="stylesheet" href="/admin_listings_v2.css" />
  <link rel="stylesheet" type="text/css" href="/admin_listings_ui.css" />
  <link rel="stylesheet" type="text/css" href="/staff-mfa.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
  <link rel="stylesheet" href="/assessment-workflow.css" />
  <link rel="stylesheet" href="/research_workflow_panel.css" />
  <link rel="stylesheet" href="/project1_research_stages.css" />
  <!-- Stage 3 research-objective review (Section A fixed objectives, Section B
       additional objectives, sticky scope rail). Scoped to .s3o-* so it cannot
       restyle the p1-* stage cards it sits inside. -->
  <link rel="stylesheet" href="/sitewise_stage3_objectives.css" />
  <!-- M2 Stage 2 workspace layout. Kept as its own file so the assessment
       journey stepper, progress panel and AppLayout topbar are untouched. -->
  <link rel="stylesheet" href="/m2_workspace_layout.css" />
  <!-- Stage 3 review portal + Stage 4 questionnaire preview. Scoped under
       .sw-review-portal / .sw-questionnaire-preview so shared class names
       (card, pill, btn, q-row) are not redefined globally. -->
  <link rel="stylesheet" href="/sitewise_review_pages.css" />
  <!-- Café demand report (R01–R12) + activity history. Scoped to sr-*. -->
  <link rel="stylesheet" href="/sitewise_report_activity.css" />
  <!-- "Select Assessment to View Report" gate now shown at
       /entrepreneur/cafe-report, before the original report shell. Scoped to
       .sra-* so it cannot restyle anything else. -->
  <link rel="stylesheet" href="/sitewise_assessment_report_selector.css" />
  <!-- "Assessment" nav list. Scoped to .swal-* so it cannot restyle the
       existing .sra-* selector or anything else in the shell. -->
  <link rel="stylesheet" href="/sitewise_assessment_list.css" />
  <!-- Assessment tab, "My assessments" entry view: the two-column list +
       details layout. Scoped to .asw-entry / .asw-inline-detail, which only
       assessment_workspace_page.dart emits. These classes previously had no
       CSS at all, so the view rendered unstyled. -->
  <link rel="stylesheet" href="/sitewise_assessment_entry.css" />
  <!-- Assessment workspace, Step 5: Customer Questionnaire. Port of the
       supplied design, scoped to .cq5 so it cannot reach the sidebar, the top
       bar or any other page. -->
  <link rel="stylesheet" href="/sitewise_cq_step5.css" />
  <!-- PROJECT1 v1.5 four-step research flow. Three scoped sheets:
       .ao-* assessment overview list, .m1-* Step 1 M2 editor, and .af-* the
       flow host + shared four-step stepper. Each is scoped to its own prefix
       so none of them restyle the existing workspace or shell.

       NOTE: `assessment_overview_page.css` is intentionally absent. It was
       referenced here but has never existed in this repository (no git history,
       no file under web/), so every page load issued a 404 for it. The .ao-*
       styles it was meant to hold were never written; the assessment overview
       list is styled by `sitewise_assessment_entry.css` (.asw-*). The dead
       reference was removed rather than a stub file created, because an empty
       stylesheet would make a missing feature look present. -->
  <link rel="stylesheet" href="/m2_step_one_page.css" />
  <link rel="stylesheet" href="/research_assessment_flow_page.css" />
  <!-- PROJECT1 V1.5 Step 2 "Business preferences" mock UI. Scoped to
       .sw2-step2 (emitted only on the Stage 2 M2 screen) plus
       body:has(.sw2-step2) for the shared topbar. Loaded last so its
       overrides win without editing any existing stylesheet. -->
  <link rel="stylesheet" href="/step2_business_preferences_mock.css" />
  <script src="/vendor/three.min.js" defer></script>
  <!-- Explore map: self-hosted Leaflet + markercluster (no CDN, no API key).
       Loaded with defer so execution order is leaflet -> cluster ->
       sitewise_combined_explore -> main.client.dart.js. The explore script
       only reacts to DOM state this app renders; the app bundle still boots
       exactly as before. -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/vendor/leaflet/MarkerCluster.css" />
  <link rel="stylesheet" href="/vendor/leaflet/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/sitewise_combined_explore.css" />
  <link rel="stylesheet" href="/sitewise_explore_spacing.css" />
  <link rel="stylesheet" href="/sitewise_recommendation_location_picker.css" />
  <link rel="stylesheet" href="/property_detail_upgrade.css" />
  <link rel="stylesheet" href="/full_analysis.css" />
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/vendor/leaflet/leaflet.markercluster.js" defer></script>
  <script src="/map-config.js" defer></script>
  <script src="/sitewise_combined_explore.js" defer></script>
  <script src="/sitewise_recommendation_location_picker.js" defer></script>
  <script src="/three_scene.js" defer></script>
  <script src="/reveal.js" defer></script>
  <script src="/auth_bundle.js" defer></script>

  <!-- Loads and runs the compiled 'main.client.dart' file (the router and
         every page; jaspr_builder generates the web entrypoint stub). -->
  <script defer src="/main.client.dart.js"></script>
  <link rel="stylesheet" href="/admin_accessibility.css?v=1" />
  <link rel="stylesheet" href="/admin_property_review_accessibility.css?v=1" />
</head>

<body>
  <noscript>
    Sitewise uses JavaScript for filtering, saving and comparisons. Pages,
    listings and navigation still read without it.
  </noscript>
  <!-- Pre-boot placeholder: discarded when the app mounts (jaspr removes any
         body children it does not hydrate). -->
  <div id="boot" style="min-height: 100vh; display: grid; place-items: center">
    <span aria-hidden="true" class="spinner"></span>
  </div>
</body>

</html>
