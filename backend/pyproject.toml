[project]
name = "sitewise"
version = "0.1.0"
description = "SiteWise backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "supabase>=2.34",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.7", "joblib>=1.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
