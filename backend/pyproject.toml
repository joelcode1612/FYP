[project]
name = "sitewise"
version = "0.1.0"
description = "SiteWise backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.9",
    "supabase>=2.34",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.20",
    # PU research model inference (both artifacts load under these; verified
    # with Python 3.13 / numpy 2.5): joblib was previously dev-only, the
    # selected model artifact requires scikit-learn 1.8.x, SHAP explanations
    # use 0.50.x permutation SHAP on the existing ShapExplainer.
    "joblib>=1.3",
    "scikit-learn>=1.8,<1.9",
    "shap>=0.50,<0.51",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.7", "joblib>=1.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: real SHAP / model inference that takes about a minute"]
