name: jaspr_provider_compat
description: >-
  A vendored, Jaspr-0.23-native implementation of the provider pattern
  (Provider / ChangeNotifierProvider / MultiProvider / Consumer / Selector and
  context.read / watch / select). Exists because the published `jaspr_provider`
  package is abandoned and pins `jaspr ^0.1.4`, which cannot resolve against
  this workspace's `jaspr ^0.23.5`.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Member of the fyp_workspace pub workspace: resolution and the lockfile are
# shared with the sibling packages, so this package can never pin a different
# jaspr than the web app uses.
resolution: workspace

dependencies:
  jaspr: ^0.23.5

dev_dependencies:
  jaspr_test: ^0.23.5
  lints: ^6.0.0
  test: 1.31.0
