# Dart pub workspace root for the Sitewise FYP monorepo.
#
# A workspace lets these packages share ONE dependency resolution and ONE
# lockfile while remaining separate packages with their own pubspecs:
#   * fyp_mobile_app — the Flutter app (mobile + Flutter-web UI).
#   * fyp_jaspr_web  — the Jaspr web app (real HTML/CSS for SEO).
#   * shared_logic   — framework-free domain + application logic used by both.
#
# One pubspec cannot drive both `flutter build` and `jaspr build`, so the apps
# must stay separate packages; `shared_logic` must stay free of Flutter because
# the Jaspr app compiles to JavaScript where Flutter does not exist.
#
# Member packages declare `resolution: workspace` and depend on each other
# with the `any` constraint; pub binds that to the local workspace member.
#
# Run `flutter pub get` from fyp_mobile_app (or `dart pub get` here) to resolve
# the whole workspace. The lockfile lives at this root, not in the members.
name: fyp_workspace
description: Workspace root for the Sitewise FYP (Flutter app + Jaspr web app + shared logic).
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - fyp_mobile_app
  - fyp_jaspr_web
  - shared_logic

# Native asset build options for dartcv4 (opencv_dart), consumed by the
# Flutter app's 38-target panorama pipeline.
#
# WHY THIS LIVES IN THE WORKSPACE ROOT: native-assets `hooks.user_defines`
# are resolved from the ROOT package of the resolution. A pub workspace has
# ONE resolution whose root is THIS pubspec, so defines declared only inside
# a member (fyp_mobile_app) never reach the hooked package's build hook —
# the app builds fine but ships dartcv4's DEFAULT module set
# (`{imgcodecs, imgproc}`), which compiles features2d/calib3d/stitching OUT
# of `libdartcv.so`. The runtime then fails at the first ORB call:
#
#     Couldn't resolve native function 'cv_ORB_create_1'
#     in 'package:dartcv4/dartcv.dart'
#
# That exact defect was reproduced and fixed from this block (2026-11-23);
# `integration_test/opencv_orb_native_test.dart` is the device-level
# regression guard. The module list must be the union of every OpenCV entry
# point the pipeline calls — `include_modules` REPLACES dartcv4's defaults,
# so imgproc and imgcodecs are repeated here even though they are defaults.
hooks:
  user_defines:
    dartcv4:
      parallel_jobs: 4
      include_modules:
        - imgproc
        - imgcodecs
        - stitching
        - features2d
        - flann
        - calib3d
