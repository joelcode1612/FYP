name: shared_logic
description: >-
  Framework-free domain and data layers shared by the Sitewise Flutter app and
  the Jaspr web app. No Flutter, no Jaspr, no third-party dependencies.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Member of the fyp_workspace pub workspace: dependency resolution and the
# lockfile are shared with the sibling packages.
resolution: workspace

# Deliberately minimal and pure Dart only (no Flutter, no Jaspr), so the Jaspr
# app can compile this package to JavaScript and the Flutter app can use it
# natively.
#
# `bloc` backs the five application cubits (auth/app/owner/entrepreneur/admin)
# and is pure Dart. It MUST stay declared: the cubits import `package:bloc`
# directly, and without it `flutter analyze` / `flutter test` fail with
# "The getter 'state' isn't defined for the type 'AuthCubit'".
# `riverpod` backs `application/notifiers/providers.dart`.
dependencies:
  bloc: ^9.2.1
  riverpod: ^3.3.2
dev_dependencies:
  test: 1.31.0
