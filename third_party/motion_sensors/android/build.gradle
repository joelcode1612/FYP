group = "finaldev.motion_sensors"
version = "1.0-SNAPSHOT"

// Vendored copy of motion_sensors 0.1.0 (transitive via `panorama`).
//
// The pub.dev release is unbuildable on this project's toolchain:
//   * `jcenter()` — removed from Gradle 9's RepositoryHandler, so the script
//     fails to evaluate ("Could not find method jcenter()").
//   * AGP 3.5.0 classpath + `lintOptions` — dead DSL under AGP 9.
//   * No `namespace` — required by AGP 8+ (the manifest `package` attribute
//     was dropped instead).
//
// Behaviour is unchanged: same group, same Kotlin source, same minSdk. Only
// the build wiring is modernised.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "finaldev.motion_sensors"

    // Matches FlutterExtension.compileSdkVersion for Flutter 3.44.
    compileSdkVersion 36

    // The app compiles at Java 17 (see fyp_mobile_app/android/app/build.gradle.kts).
    // Without an explicit target the plugin would fall back to Java 11 while
    // Kotlin inherits the JDK's 21, which AGP rejects as an inconsistent
    // JVM-target pairing.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdkVersion 24
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}